[package]
name = "motion-cpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The CPU reference backend of motion-rs: plain f32, the contract every other backend is checked against."

[dependencies]
motion-core.workspace = true
rayon.workspace = true

[lints.rust]
# One `unsafe` block: the GEMM tasks write disjoint output elements through a shared pointer.
unsafe_code = "deny"

[lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
