[workspace]
resolver = "2"
members = [
    "crates/motion-core",
    "crates/motion-cpu",
    "crates/motion-nn",
    "crates/motion-bricks",
    "crates/motion-kimodo",
    "crates/motion-text",
    "crates/motion-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zaitrarrio/motion-rs"

[workspace.dependencies]
motion-core = { path = "crates/motion-core" }
motion-cpu = { path = "crates/motion-cpu" }
motion-nn = { path = "crates/motion-nn" }
motion-check = { path = "crates/motion-check" }
motion-kimodo = { path = "crates/motion-kimodo" }
motion-bricks = { path = "crates/motion-bricks" }
motion-text = { path = "crates/motion-text" }
motion-wgpu = { path = "crates/motion-wgpu" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2.7"
memmap2 = "0.9"
rayon = "1.12"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
bytemuck = "1"
pollster = "1"
wgpu = "30"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ureq = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
